[workspace]
resolver = "2"
members = [
    "crates/riddim-rt",
    "crates/riddim-time",
    "crates/riddim-model",
    "crates/riddim-graph",
    "crates/riddim-disk",
    "crates/riddim-engine",
    "crates/riddim-plugin",
    "crates/riddim-io",
    "crates/riddim-cli",
    "fixtures/testplug",
    "fixtures/crashplug",
    "fixtures/support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/kaminocorp/riddim"
publish = false

[workspace.dependencies]
riddim-rt = { path = "crates/riddim-rt" }
riddim-time = { path = "crates/riddim-time" }
riddim-model = { path = "crates/riddim-model" }
riddim-graph = { path = "crates/riddim-graph" }
riddim-disk = { path = "crates/riddim-disk" }
riddim-engine = { path = "crates/riddim-engine" }
riddim-plugin = { path = "crates/riddim-plugin" }
riddim-io = { path = "crates/riddim-io" }
riddim-test-support = { path = "fixtures/support" }

rtrb = "0.4.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
vst3 = "0.3.0"
libloading = "0.9"
crossbeam-queue = "0.3"
clap = { version = "4", features = ["derive"] }
proptest = "1"
midly = { version = "0.5", default-features = false, features = ["std", "alloc"] }

# macOS system frameworks (only built on macOS).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-audio-toolbox = "0.3"
objc2-core-audio-kit = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
coremidi = "0.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
missing_safety_doc = "allow"
too_many_arguments = "allow"
# `n % k == 0` reads fine and is what audio code is full of.
manual_is_multiple_of = "allow"

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
