[workspace]
resolver = "2"
members = [
    "crates/riddim-rt",
    "crates/riddim-plugin",
    # "crates/riddim-io",
    # "crates/riddim-cli",
    "fixtures/testplug",
    "fixtures/crashplug",
    "fixtures/support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/kaminocorp/riddim"
publish = false

[workspace.dependencies]
riddim-rt = { path = "crates/riddim-rt" }
riddim-plugin = { path = "crates/riddim-plugin" }
riddim-io = { path = "crates/riddim-io" }
riddim-test-support = { path = "fixtures/support" }

rtrb = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vst3 = "0.3.0"
libloading = "0.9"
crossbeam-queue = "0.3"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
missing_safety_doc = "allow"
too_many_arguments = "allow"

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
