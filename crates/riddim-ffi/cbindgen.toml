language = "C"
include_guard = "RIDDIM_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
line_length = 100
tab_width = 4
header = """/*
 * Riddim engine: C ABI, version 0.
 *
 * Copyright (C) 2026 Kamino Research Corporation
 * (legal entity: Bradgate Capital Management Pte Ltd, Singapore).
 * SPDX-License-Identifier: AGPL-3.0-only
 *
 * Generated by cbindgen from crates/riddim-ffi/src/lib.rs. Do not edit by hand:
 *   RIDDIM_UPDATE_HEADER=1 cargo test -p riddim-ffi --test header
 *
 * Conventions
 *   - Strings in are NUL-terminated UTF-8. Strings out are owned by the caller and must be
 *     released with riddim_string_free.
 *   - Structured data (configuration, edit ops, the model, events) crosses as JSON.
 *   - Functions that can fail return 0 or NULL and record a message readable with
 *     riddim_last_error on the same thread.
 *   - An engine handle may be used from any thread, one call at a time, except
 *     riddim_main_thread_pump, which belongs to the application's main thread.
 */"""

[export]
prefix = ""
include = ["RiddimEngine", "RiddimStatus", "RiddimTransportCommand", "RiddimTransportState"]

[enum]
prefix_with_name = false
rename_variants = "ScreamingSnakeCase"
