[package]
name = "riddim-rt"
description = "Real-time building blocks for Riddim: SPSC queues, deferred drop, smoothing, RT-safety guards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Tie real-time sections to LLVM's RealtimeSanitizer, which also catches locks and blocking
# system calls. Takes effect only when built with RTSAN_ENABLE=1; see scripts/rtsan.sh.
rtsan = ["dep:rtsan-standalone"]

[dependencies]
rtrb.workspace = true
rtsan-standalone = { workspace = true, optional = true }

[lints]
workspace = true
