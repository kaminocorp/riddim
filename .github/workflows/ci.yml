name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy (Linux and macOS targets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain, its components and the macOS target.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (host)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # macOS-only code (CoreAudio, CoreMIDI, Audio Units, editor windows) cannot be built on
      # this runner, but it can be type-checked and linted for the Apple Silicon target.
      - name: clippy (aarch64-apple-darwin, type-check only)
        run: cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings

  test:
    name: tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  third-party:
    name: third-party plugins (Surge XT on Linux)
    runs-on: ubuntu-24.04
    env:
      SURGE_VERSION: "1.3.4"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Cache Surge XT
        id: surge
        uses: actions/cache@v4
        with:
          path: ~/thirdparty/surge
          key: surge-xt-linux-${{ env.SURGE_VERSION }}
      - name: Download Surge XT
        if: steps.surge.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/thirdparty/surge
          curl --fail --location --retry 5 --retry-delay 10 --silent --show-error \
            --output /tmp/surge.tar.gz \
            "https://github.com/surge-synthesizer/releases-xt/releases/download/${SURGE_VERSION}/surge-xt-linux-${SURGE_VERSION}-pluginsonly.tar.gz"
          tar -xzf /tmp/surge.tar.gz -C ~/thirdparty/surge
      - name: Runtime libraries Surge XT links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2t64 libfreetype6 libfontconfig1
      - name: Conformance run against Surge XT
        run: |
          export RIDDIM_TEST_VST3="$HOME/thirdparty/surge/Surge XT.vst3;$HOME/thirdparty/surge/Surge XT Effects.vst3"
          cargo test -p riddim-plugin --test third_party -- --nocapture

  licenses:
    name: dependency licences and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
